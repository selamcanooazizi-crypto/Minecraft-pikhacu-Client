name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PikachuClient-1.20.1-Source.zip -d proje
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: cd proje && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PikachuClient-1.20.1
          path: proje/build/libs/PikachuClient-1.20.1.jar
